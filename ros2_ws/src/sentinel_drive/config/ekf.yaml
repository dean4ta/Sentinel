# EKF fusion of wheel odometry + D435i IMU (robot_localization ekf_node).
#
# Fuses wheel velocities (not pose - no double integration) and gyro yaw
# rate only. Mecanum base: vy is meaningful, so both vx and vy are on.
# IMU topic/frame to verify after realsense bringup:
#   ros2 topic echo --once /camera/imu | head -20
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    world_frame: odom
    odom_frame: odom
    base_link_frame: base_link

    odom0: /wheel_odom
    #              x      y      z      roll   pitch  yaw    vx     vy     vz     vroll  vpitch vyaw   ax     ay     az
    odom0_config: [false, false, false, false, false, false, true,  true,  false, false, false, true,  false, false, false]
    odom0_queue_size: 10

    imu0: /camera/imu
    #             x      y      z      roll   pitch  yaw    vx     vy     vz     vroll  vpitch vyaw   ax     ay     az
    imu0_config: [false, false, false, false, false, false, false, false, false, false, false, true,  false, false, false]
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 10
