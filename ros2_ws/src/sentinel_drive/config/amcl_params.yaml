amcl:
  ros__parameters:
    use_sim_time: false

    # Frames: map <- (amcl) <- odom <- (EKF) <- base_link.
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link

    scan_topic: /scan
    # Fused wheel+gyro odom from the EKF (default "odom" is never published).
    odom_topic: /wheel_imu_odom_filtered
    # RPLIDAR A1: 0.2-12 m. -1 disables the min-range filter.
    laser_min_range: -1.0
    laser_max_range: 12.0
    laser_model_type: likelihood_field
    max_beams: 60

    # Mecanum odom reports vx+vy, use the omni motion model.
    robot_model_type: nav2_amcl::OmniMotionModel

    # Odometry noise (trust the fused wheel+gyro odom: small alphas).
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    min_particles: 500
    max_particles: 2000
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    pf_err: 0.05
    pf_z: 0.99

    # Update gate: re-filter after 0.25 m or 0.2 rad.
    update_min_a: 0.2
    update_min_d: 0.25

    laser_likelihood_max_dist: 2.0
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    lambda_short: 0.1

    sigma_res: 0.05
    transform_tolerance: 1.0

    # amcl owns map -> odom (map_server's static one is overridden).
    tf_broadcast: true
    save_pose_rate: 0.5

    # Initial pose comes from Foxglove/RViz (/initialpose); set these
    # to start at a known pose instead.
    set_initial_pose: false
    always_reset_initial_pose: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
