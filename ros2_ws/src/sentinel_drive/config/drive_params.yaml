gamepad_twist:
  ros__parameters:
    deadzone: 0.05
    invert_strafe: false
    invert_rotate: false
    rotate_limit: 6.0   # rad/s, full-stick rotate ceiling
    speed_scale: 0.5
    # PS4 button 0 = X (cross). With record:=true the launch overrides
    # exit_on_x to true: pressing X ends the whole recording run.
    exit_on_x: false
    exit_button: 0

cmd_vel_serial:
  ros__parameters:
    serial_port: /dev/sentinel_pico
    baud: 460800

    # Mecanum IK: ik_wheelbase_m = half-track + half-wheelbase (m),
    # measure on the robot. ik_roller_swap flips the strafe+rotate
    # wheel terms if the diagonal roller pairing differs from the
    # assumed layout (symptom: strafe stick rotates the robot).
    ik_wheelbase_m: 0.35
    ik_roller_swap: false

    publish_rate: 50.0
    rpm_ema_alpha: 0.8      # EMA blend for measured rpm (0.3-0.5 typical)
    pid_enabled: true       # PID block enable, independent of feed-forward
    # Velocity feed-forward, independent of the PID block:
    #   FF off, PID off -> open loop      FF on,  PID off -> ff only
    #   FF off, PID on  -> PID            FF on,  PID on  -> ff + PID
    # output then passes the per-wheel output limit.
    feed_forward_enabled: true   # independently enables velocity feed-forward

    # Per-wheel sections. For each wheel:
    #   *_output_limit: cap on commanded PWM, PID and open-loop.
    #   *_kp/ki/kd: PID gains, error in rpm -> normalized PWM.
    #   *_kS, *_kV: feed-forward u_ff = kS * sign(v_ref) + kV * v_ref
    #     (v_ref = target / WHEEL_MAX_RPM). kS compensates static
    #     friction (deadband), kV the velocity gain.

    # FL (front-left)   ## LOCKED IN - Sept 28th, 2026 ##
    fl_output_limit: 1.0
    fl_kp: 0.0005
    fl_ki: 0.001
    fl_kd: 0.0
    fl_kS: 0.05
    fl_kV: 0.88

    # FR (front-right)  ## LOCKED IN - Sept 28th, 2026 ##
    fr_output_limit: 1.0
    fr_kp: 0.0005
    fr_ki: 0.0005
    fr_kd: 0.0
    fr_kS: 0.11
    fr_kV: 0.95

    # BL (back-left)    ## LOCKED IN - Sept 28th, 2026 ##
    bl_output_limit: 1.0
    bl_kp: 0.0005
    bl_ki: 0.0005
    bl_kd: 0.0
    bl_kS: 0.11
    bl_kV: 0.97

    # BR (back-right)   ## LOCKED IN - Sept 28th, 2026 ##
    br_output_limit: 1.0
    br_kp: 0.001
    br_ki: 0.0005
    br_kd: 0.0
    br_kS: 0.09
    br_kV: 0.96
