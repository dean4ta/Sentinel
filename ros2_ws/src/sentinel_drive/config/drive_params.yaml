gamepad_twist:
  ros__parameters:
    deadzone: 0.05
    invert_strafe: false
    rotate_limit: 1.5   # rad/s, full-stick rotate ceiling
    speed_scale: 0.25

cmd_vel_serial:
  ros__parameters:
    serial_port: /dev/sentinel_pico
    baud: 460800
    publish_rate: 50.0
    # Per-wheel speed PID gains (error in rpm -> normalized PWM). Defaults
    # are conservative placeholders pending tuning.
    pid_output_limit: 0.3   # cap on PID output: keeps wheel rpm low
    rpm_ema_alpha: 0.4      # EMA blend for measured rpm (0.3-0.5 typical)
    pid_enabled: false      # false = open-loop: target rpm -> PWM directly
                            # (still capped at pid_output_limit)
    fl_kp: 0.005
    fl_ki: 0.0
    fl_kd: 0.0
    fr_kp: 0.005
    fr_ki: 0.0
    fr_kd: 0.0
    bl_kp: 0.005
    bl_ki: 0.0
    bl_kd: 0.0
    br_kp: 0.005
    br_ki: 0.0
    br_kd: 0.0
