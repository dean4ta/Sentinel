gamepad_twist:
  ros__parameters:
    deadzone: 0.05
    invert_strafe: false
    rotate_limit: 1.5   # rad/s, full-stick rotate ceiling
    speed_scale: 0.25

cmd_vel_serial:
  ros__parameters:
    serial_port: /dev/sentinel_pico
    baud: 460800
    publish_rate: 50.0
    # Per-wheel speed PID gains (error in rpm -> normalized PWM). Defaults
    # are conservative placeholders pending tuning.
    output_limit: 0.45      # cap on commanded PWM, PID and open-loop
    rpm_ema_alpha: 0.2      # EMA blend for measured rpm (0.3-0.5 typical)
    pid_enabled: true       # false = open-loop: target rpm -> PWM directly
                            # (still capped at output_limit)
    # Open-loop plant fit (FL, on blocks, 2026-09-25):
    # measured rpm ~ gain * (cmd_rpm - deadband_rpm) above deadband.
    ff_deadband_rpm: 14.0   # feedforward target below this -> 0
    ff_gain: 1.17
    fl_kp: 0.001
    fl_ki: 0.001
    fl_kd: 0.00001
    fr_kp: 0.001
    fr_ki: 0.001
    fr_kd: 0.00001
    bl_kp: 0.001
    bl_ki: 0.001
    bl_kd: 0.00001
    br_kp: 0.001
    br_ki: 0.001
    br_kd: 0.00001
