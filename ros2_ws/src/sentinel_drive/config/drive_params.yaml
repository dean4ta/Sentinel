gamepad_twist:
  ros__parameters:
    deadzone: 0.05
    invert_strafe: false
    rotate_limit: 1.5   # rad/s, full-stick rotate ceiling
    speed_scale: 0.25

cmd_vel_serial:
  ros__parameters:
    serial_port: /dev/sentinel_pico
    baud: 460800
    publish_rate: 50.0
    # Per-wheel speed PID gains (error in rpm -> normalized PWM).
    # Per-wheel cap on commanded PWM, PID and open-loop.
    fl_output_limit: 0.45
    fr_output_limit: 0.50
    bl_output_limit: 0.45
    br_output_limit: 0.45
    rpm_ema_alpha: 0.2      # EMA blend for measured rpm (0.3-0.5 typical)
    pid_enabled: true       # PID block enable, independent of feed-forward
    # Velocity feed-forward, independent of the PID block:
    #   FF off, PID off -> open loop      FF on,  PID off -> ff only
    #   FF off, PID on  -> PID            FF on,  PID on  -> ff + PID
    # output then passes the per-wheel output limit.
    feed_forward_enabled: true  # independently enables velocity feed-forward
    k_ff: 1.15                  # feed-forward gain for normalized target
                                # velocity: u_ff = k_ff * (target / WHEEL_MAX_RPM).
                                # Initial value from measured open-loop
                                # response. Negative targets -> negative ff.
    fl_kp: 0.001
    fl_ki: 0.001
    fl_kd: 0.00001
    fr_kp: 0.004
    fr_ki: 0.003
    fr_kd: 0.00005
    bl_kp: 0.001
    bl_ki: 0.001
    bl_kd: 0.00001
    br_kp: 0.001
    br_ki: 0.001
    br_kd: 0.00001
